[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poultryguard-ai"
version = "0.1.0"
description = "AI-assisted poultry farm management, analytics and knowledge support."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Zulyadaini Muhammad Aminu" }
]
keywords = [
  "poultry",
  "farm-management",
  "farm-analytics",
  "rag",
  "faiss",
  "agritech",
  "smallholder-farmers"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "rag*", "models*"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "rag", "models", "tests", "benchmarks", "evaluation", "profiler", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
